[package]
name = "muhan_core"
version = "2.0.0"
edition = "2021"
description = "MuHanEasyNotes NEO Rust core — database, sync, encryption"
license = "MIT"
rust-version = "1.75"

[lib]
name = "muhan_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
flutter_rust_bridge = { version = "2.10", features = ["chrono"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
url = "2"
percent-encoding = "2"
walkdir = "2"
mime_guess = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
