name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath muhan_easy_notes_neo_windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: muhan_easy_notes_neo_windows.zip

  build-macos:
    name: Build macOS (dmg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build macos --release -v 2>&1 | tail -50
      - name: Package dmg
        run: |
          mkdir -p /tmp/apps
          cp -R build/macos/Build/Products/Release/*.app /tmp/apps/
          hdiutil create -volname "MuHanEasyNotes NEO" -srcfolder /tmp/apps -ov -format UDZO muhan_easy_notes_neo_macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: muhan_easy_notes_neo_macos.dmg

  build-linux:
    name: Build Linux (tar.gz)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev ninja-build liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release -v 2>&1 | tail -50
      - name: Package tar.gz
        run: cd build/linux/x64/release/bundle && tar -czvf ../../../muhan_easy_notes_neo_linux.tar.gz . && cd ../../../../..
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: muhan_easy_notes_neo_linux.tar.gz

  build-web:
    name: Build Web (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
      - run: flutter build web --release
      - name: Package web
        run: cd build/web && zip -r ../../muhan_easy_notes_neo_web.zip . && cd ../..
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: muhan_easy_notes_neo_web.zip

  build-android:
    name: Build Android (apk)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter config --android-sdk $ANDROID_HOME
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk muhan_easy_notes_neo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: muhan_easy_notes_neo.apk

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux, build-web, build-android]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Display artifacts
        run: ls -lh artifacts/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'MuHanEasyNotes NEO v${{ github.ref_name }}'
          generate_release_notes: true
          body: |
            ## MuHanEasyNotes NEO ${{ github.ref_name }}

            🎉 **Flutter + Rust 跨平台重构版**

            ### 新特性
            - ✨ Flutter + Rust 技术栈
            - 🪟 Windows Fluent Design / macOS HIG / Linux GTK / Web PWA
            - 🔄 旧版数据迁移向导
            - 🔐 本地 AES-GCM 加密
            - ☁️ WebDAV 同步
            - 🏷️ 7 种主题色、置顶、回收站

            ### 移除
            - ❌ 语音输入功能
            - ❌ Android Wear OS 支持

            ### 升级指南
            1. 旧版用户导出 JSON 备份
            2. 安装新版，首次启动运行迁移向导
            3. 选择旧版 JSON 文件完成导入
          files: artifacts/*
