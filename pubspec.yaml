name: muhan_easy_notes_neo
description: "MuHanEasyNotes NEO (慕寒易笔记) — 跨平台轻量笔记应用"
publish_to: 'none'
version: 2.0.1+200100

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  go_router: ^14.2.0
  provider: ^6.1.2
  file_picker: 8.3.7
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  flutter_rust_bridge: ^2.10.0
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Icon generation (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_1024.png"
  min_sdk_android: 24
  adaptive_icon_background: "#F9CA24"
  adaptive_icon_foreground: "assets/icons/icon_1024.png"
  web:
    generate: true
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
